# Model registry.
#
# local: served with vLLM from local weights (shared_models cache).
#   `path` is either a HF repo id resolvable inside the HF cache, or an
#   absolute snapshot path. `hf_cache` points vLLM/transformers at the shared cache.
# openrouter: served via the OpenRouter API using `api_model`.

hf_cache: /mnt/dv/wid/projects3/Rogers-muri-human-ai/shared_models

local:
  # --- present on disk in shared_models today (no download needed) ---
  llama-3.1-8b-instruct:
    path: meta-llama/Llama-3.1-8B-Instruct
    chat: true
  mistral-7b-instruct-v0.3:
    path: mistralai/Mistral-7B-Instruct-v0.3
    chat: true
  gemma-3-12b-it:
    path: google/gemma-3-12b-it
    chat: true
  llama-3-8b-instruct:
    path: meta-llama/Meta-Llama-3-8B-Instruct
    chat: true
  # --- leaderboard models to download into the shared cache when ready ---
  qwen2.5-7b-instruct:
    path: Qwen/Qwen2.5-7B-Instruct
    chat: true
    download: true
    params_b: 7
  qwen2.5-14b-instruct:
    path: Qwen/Qwen2.5-14B-Instruct
    chat: true
    download: true
  gemma-2-9b-it:
    path: google/gemma-2-9b-it
    chat: true
    download: true
  # --- OLMo-2-7B training lineage: isolates WHICH stage adds coherence ---
  # base is pretrained-only (no chat template) -> chat:false; the rest are tuned.
  olmo2-7b-base:
    path: allenai/OLMo-2-1124-7B
    chat: false
    download: true
    stage: base
  olmo2-7b-sft:
    path: allenai/OLMo-2-1124-7B-SFT
    chat: true
    download: true
    stage: sft
  olmo2-7b-dpo:
    path: allenai/OLMo-2-1124-7B-DPO
    chat: true
    download: true
    stage: dpo
  olmo2-7b-instruct:
    path: allenai/OLMo-2-1124-7B-Instruct
    chat: true
    download: true
    stage: rlvr
  # --- Tulu-3-8B lineage (Llama-3.1-8B base, different post-train recipe than OLMo) ---
  tulu3-8b-base:
    path: meta-llama/Llama-3.1-8B
    chat: false
    stage: base
  tulu3-8b-sft:
    path: allenai/Llama-3.1-Tulu-3-8B-SFT
    chat: true
    download: true
    stage: sft
  tulu3-8b-dpo:
    path: allenai/Llama-3.1-Tulu-3-8B-DPO
    chat: true
    download: true
    stage: dpo
  tulu3-8b-final:
    path: allenai/Llama-3.1-Tulu-3-8B
    chat: true
    download: true
    stage: rlvr
  # --- Qwen2.5-Instruct SIZE ladder (same recipe, params vary) ---
  qwen2.5-0.5b-instruct:
    path: Qwen/Qwen2.5-0.5B-Instruct
    chat: true
    download: true
    params_b: 0.5
  qwen2.5-1.5b-instruct:
    path: Qwen/Qwen2.5-1.5B-Instruct
    chat: true
    download: true
    params_b: 1.5
  qwen2.5-3b-instruct:
    path: Qwen/Qwen2.5-3B-Instruct
    chat: true
    download: true
    params_b: 3
  # qwen2.5-7b-instruct already registered above (params_b 7)
  qwen2.5-14b-instruct-size:
    path: Qwen/Qwen2.5-14B-Instruct
    chat: true
    download: true
    quantization: bitsandbytes
    big_env: true
    params_b: 14
  qwen2.5-32b-instruct:
    path: Qwen/Qwen2.5-32B-Instruct
    chat: true
    quantization: bitsandbytes
    big_env: true
    download: true
    params_b: 32
  # --- OLMo-2-13B lineage (size x tuning-stage) ---
  olmo2-13b-base:
    path: allenai/OLMo-2-1124-13B
    chat: false
    download: true
    stage: base
  olmo2-13b-sft:
    path: allenai/OLMo-2-1124-13B-SFT
    chat: true
    download: true
    stage: sft
  olmo2-13b-dpo:
    path: allenai/OLMo-2-1124-13B-DPO
    chat: true
    download: true
    stage: dpo
  olmo2-13b-instruct:
    path: allenai/OLMo-2-1124-13B-Instruct
    chat: true
    download: true
    stage: rlvr
  # --- OLMo-2-32B lineage (largest with full training axis; H100 bf16) ---
  olmo2-32b-base:
    path: allenai/OLMo-2-0325-32B
    chat: false
    download: true
    stage: base
  olmo2-32b-sft:
    path: allenai/OLMo-2-0325-32B-SFT
    chat: true
    download: true
    stage: sft
  olmo2-32b-dpo:
    path: allenai/OLMo-2-0325-32B-DPO
    chat: true
    download: true
    stage: dpo
  olmo2-32b-instruct:
    path: allenai/OLMo-2-0325-32B-Instruct
    chat: true
    download: true
    stage: rlvr
  # --- big models: need coherence_big env (vLLM 0.8.x) + 4-bit to fit 48GB ---
  gemma-3-27b-it:
    path: google/gemma-3-27b-it
    chat: true
    quantization: bitsandbytes
    tensor_parallel: 2
    big_env: true
  mixtral-8x7b-instruct:
    path: mistralai/Mixtral-8x7B-Instruct-v0.1
    chat: true
    quantization: bitsandbytes
    tensor_parallel: 2
    big_env: true

openrouter:
  # IDs verified against openrouter.ai/api/v1/models on 2026-07-04.
  gpt-5.5:
    api_model: openai/gpt-5.5-20260423
  gpt-5.5-pro:
    api_model: openai/gpt-5.5-pro-20260423
  claude-opus-4.8:
    api_model: anthropic/claude-opus-4.8
  claude-sonnet-5:
    api_model: anthropic/claude-sonnet-5-20260630
  # --- additional frontier / open models via OpenRouter (IDs verified 2026-07-05) ---
  deepseek-v4-pro:
    api_model: deepseek/deepseek-v4-pro
  gpt-oss-120b:
    api_model: openai/gpt-oss-120b:high
  minimax-m3:
    api_model: minimax/minimax-m3
  kimi-k2.6:
    api_model: moonshotai/kimi-k2.6
  glm-5.2:
    api_model: z-ai/glm-5.2
  gemini-3.5-flash:
    api_model: google/gemini-3.5-flash
  mistral-medium-3:
    api_model: mistralai/mistral-medium-3
